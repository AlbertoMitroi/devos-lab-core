  - id: core-flow-aggregate
    area: eventstore
    question: Which aggregate applies the flow events, and which statuses are built in?
    expected: FlowAggregate has one Apply method per flow event; FlowStatuses defines Started, InProgress and Withdrawn.
    evidence:
      - src/Lab.Core.Workflow.EventFlow/FlowAggregate.cs:9
      - src/Lab.Core.Workflow.EventFlow/FlowAggregate.cs:27
      - src/Lab.Core.Workflow.EventFlow/FlowAggregate.cs:53
      - src/Lab.Core.Workflow.EventFlow/FlowAggregate.cs:58

  - id: core-analyzer
    area: workflow
    question: What does EventFlowAnalyzer return, and how does it choose at an exclusive gateway?
    expected: Analyze(ProcessDefinition, FlowAggregate) returns FlowAnalysis (process id, open tasks with lane and work team, available actions, status, completed flag, reached end event). At an exclusive gateway it takes the flow whose condition equals the last outcome, else the default flow. A Withdrawn flow returns no tasks and no actions and counts as completed.
    evidence:
      - src/Lab.Core.Workflow.EventFlow/EventFlowAnalyzer.cs:7
      - src/Lab.Core.Workflow.EventFlow/EventFlowAnalyzer.cs:21
      - src/Lab.Core.Workflow.EventFlow/EventFlowAnalyzer.cs:23
