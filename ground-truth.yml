      - src/Lab.Core.Transform.Bpmn/ProcessMetaData.cs:22
      - src/Lab.Core.Transform.Bpmn/ProcessMetaData.cs:25

  - id: core-flow-events
    area: eventstore
    question: Which flow events exist?
    expected: FlowStarted, TaskCompleted, ActionExecuted, FlowDataUpdated, FlowStatusChanged and FlowFactRaised, all deriving from the abstract record FlowEvent(Guid FlowId).
    evidence:
      - src/Lab.Core.Workflow.EventFlow/FlowEvents.cs:4
      - src/Lab.Core.Workflow.EventFlow/FlowEvents.cs:6
      - src/Lab.Core.Workflow.EventFlow/FlowEvents.cs:9
