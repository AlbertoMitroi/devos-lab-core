      - src/Lab.Core.Workflow.EventFlow/EventFlowAnalyzer.cs:110
      - src/Lab.Core.Workflow.EventFlow/EventFlowAnalyzer.cs:111

  - id: core-plugin-interfaces
    area: workflow
    question: Which plugin interfaces does the Flow Engine define, and with which method?
    expected:
