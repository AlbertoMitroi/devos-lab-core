      - "IHandleUserTaskCommand<in TCommand> where TCommand : IUserTaskCommand: Task<string?> Handle(TCommand, FlowContext, CancellationToken)"
      - "IHandleAction: Task Handle(FlowContext, CancellationToken)"
      - "IHandleNewFlow: Task Initialize(FlowContext, IReadOnlyDictionary<string, string>, CancellationToken)"
    evidence:
      - src/Lab.Core.Workflow.EventFlow/Plugins/IHandleServiceTask.cs:7
      - src/Lab.Core.Workflow.EventFlow/Plugins/IHandleServiceTask.cs:10
      - src/Lab.Core.Workflow.EventFlow/Plugins/IHandleUserTaskCommand.cs:12
