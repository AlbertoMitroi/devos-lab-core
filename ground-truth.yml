# Ground truth for lab-core, written from its source only (no README, no engine output).
# Each item: question, expected answer, file:line evidence. Any later change is logged with reason and evidence.
repository: lab-core
sourceCommit: bacebb1372bbb45718916abff1f34aea44579e70
items:
  - id: core-packages
    area: packages
    question: Which NuGet packages does this repository produce?
    expected:
      - Lab.Core.Transform.Bpmn
      - Lab.Core.Workflow.EventFlow
      - Lab.Core.MessageHubs
      - Lab.Core.Clients.Pricing
    evidence:
      - src/Lab.Core.Transform.Bpmn/Lab.Core.Transform.Bpmn.csproj:4
      - src/Lab.Core.Workflow.EventFlow/Lab.Core.Workflow.EventFlow.csproj:4
      - src/Lab.Core.MessageHubs/Lab.Core.MessageHubs.csproj:4
      - src/Lab.Core.Clients.Pricing/Lab.Core.Clients.Pricing.csproj:4

  - id: core-package-version
    area: packages
    question: What version do the packages get when no version is passed?
    expected: 1.0.0 (the CI publish job overrides it with the tag name without the leading v)
    evidence:
      - Directory.Build.props:7
      - Dockerfile:15

  - id: core-project-references
    area: references
    question: Which project references exist between the packages?
    expected: Lab.Core.Workflow.EventFlow references Lab.Core.Transform.Bpmn; no other project references between packages.
    evidence:
      - src/Lab.Core.Workflow.EventFlow/Lab.Core.Workflow.EventFlow.csproj:8

  - id: core-bpmn-loader
    area: workflow
    question: How is a process definition loaded, and where does its metadata come from?
    expected: BpmnProcessLoader.LoadFile reads the .bpmn file and the sibling file with the same name plus the suffix ".ProcessMetaData.json"; LoadDirectory loads every process in a folder.
    evidence:
      - src/Lab.Core.Transform.Bpmn/BpmnProcessLoader.cs:12
      - src/Lab.Core.Transform.Bpmn/BpmnProcessLoader.cs:18
      - src/Lab.Core.Transform.Bpmn/BpmnProcessLoader.cs:20
      - src/Lab.Core.Transform.Bpmn/BpmnProcessLoader.cs:27

  - id: core-node-kinds
    area: workflow
    question: Which BPMN node kinds does the model know?
    expected: [StartEvent, EndEvent, ServiceTask, UserTask, ExclusiveGateway, ParallelGateway]
    evidence:
      - src/Lab.Core.Transform.Bpmn/ProcessDefinition.cs:3

  - id: core-process-metadata
    area: workflow
    question: Which fields does a ProcessMetaData file carry?
    expected: ProcessId, DisplayName, StartedBy (flow event or fact names that start a flow), Statuses (end event id to status), Actions (name to DisplayName and AvailableDuring task ids), Participants (lane to work team).
    evidence:
      - src/Lab.Core.Transform.Bpmn/ProcessMetaData.cs:6
      - src/Lab.Core.Transform.Bpmn/ProcessMetaData.cs:13
      - src/Lab.Core.Transform.Bpmn/ProcessMetaData.cs:16
