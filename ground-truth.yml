  - id: core-test-double
    area: tests
    question: How do the tests stand in for the Pricing API?
    expected: A stub HttpMessageHandler plugged in with ConfigurePrimaryHttpMessageHandler; no WireMock in this repository.
    evidence:
      - tests/Lab.Core.Tests/RateCardClientTests.cs:12
      - tests/Lab.Core.Tests/RateCardClientTests.cs:30

  - id: core-ci-publish
    area: ci
    question: When and where are the packages published?
    expected: On tags v*, the CI job packs inside Docker and runs dotnet nuget push to GitHub Packages with the job token (packages write permission).
    evidence:
      - .github/workflows/ci.yml:6
      - .github/workflows/ci.yml:11
