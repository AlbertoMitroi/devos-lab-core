      - src/Lab.Core.Workflow.EventFlow/Plugins/IHandleNewFlow.cs:8

  - id: core-plugin-conventions
    area: workflow
    question: How is a plugin class matched to a BPMN element?
    expected: By class name. "{TaskId}Handler" handles a task, "{ActionName}ActionHandler" an action, "{ProcessId}NewFlowHandler" the start of a process.
    evidence:
      - src/Lab.Core.Workflow.EventFlow/Plugins/FlowPluginConventions.cs:6
      - src/Lab.Core.Workflow.EventFlow/Plugins/FlowPluginConventions.cs:7
      - src/Lab.Core.Workflow.EventFlow/Plugins/FlowPluginConventions.cs:8
      - src/Lab.Core.Workflow.EventFlow/Plugins/FlowPluginConventions.cs:10

  - id: core-flow-context
    area: workflow
    question: What can a plugin do through FlowContext?
    expected: SetData (FlowDataUpdated), ChangeStatus (FlowStatusChanged) and RaiseFact (FlowFactRaised); the new events are collected for the engine to append.
    evidence:
      - src/Lab.Core.Workflow.EventFlow/Plugins/FlowContext.cs:18
      - src/Lab.Core.Workflow.EventFlow/Plugins/FlowContext.cs:21
      - src/Lab.Core.Workflow.EventFlow/Plugins/FlowContext.cs:23

  - id: core-signalr-helper
    area: realtime
    question: How does the SignalR helper send messages, and how is it registered?
    expected: MessageHubUtility<THub> implements IMessageHubUtility over IHubContext<THub>; SendToAll uses Clients.All.SendAsync(method, payload), SendToSpecifiedUsers uses Clients.Users(userIds).SendAsync(method, payload). AddMessageHubUtility<THub>() registers it as a singleton. The hub route and method names are chosen by the consumer.
    evidence:
      - src/Lab.Core.MessageHubs/IMessageHubUtility.cs:4
      - src/Lab.Core.MessageHubs/MessageHubUtility.cs:5
      - src/Lab.Core.MessageHubs/MessageHubUtility.cs:9
      - src/Lab.Core.MessageHubs/MessageHubUtility.cs:12
      - src/Lab.Core.MessageHubs/MessageHubExtensions.cs:9
      - src/Lab.Core.MessageHubs/MessageHubExtensions.cs:12

  - id: core-rate-card-client-calls
    area: http
    question: Which HTTP calls does the rate card client make?
    expected:
      - "GET api/rate-cards/{productCode} (404 returns null)"
      - "GET api/residual-values?assetType={assetType}&termMonths={termMonths}"
    evidence:
      - src/Lab.Core.Clients.Pricing/RateCardClient.cs:10
      - src/Lab.Core.Clients.Pricing/RateCardClient.cs:11
      - src/Lab.Core.Clients.Pricing/RateCardClient.cs:22

  - id: core-rate-card-client-config
    area: config
    question: Where does the rate card client get its base address?
    expected: Configuration key Clients:RateCards:BaseAddress, bound through RateCardClientOptions; a missing value throws at client creation. AddRateCardClient returns the IHttpClientBuilder so the consumer can add resilience.
    evidence:
      - src/Lab.Core.Clients.Pricing/RateCardClientOptions.cs:5
      - src/Lab.Core.Clients.Pricing/RateCardClientOptions.cs:7
      - src/Lab.Core.Clients.Pricing/ServiceCollectionExtensions.cs:12
